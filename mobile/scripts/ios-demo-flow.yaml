appId: ${APP_ID}
name: Plano iOS demo
---
# The caller installs Plano on a fresh simulator and supplies its trusted TLS fixture.
- launchApp:
    stopApp: true
- assertVisible: "Connect a server"
- tapOn: "Connect a server"
# Diagnostic only: at most one additional normal tap from the known initial Home.
# The capped settle wait is not proof that navigation succeeded.
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    label: Diagnostic one additional initial Home tap
    when:
      visible: '^My flights$'
      notVisible: 'https://plano\.example\.org'
    commands:
      - runFlow:
          when:
            visible: '^Connect to your Plano server to search and track flights\.$'
          commands:
            - runFlow:
                when:
                  visible: '^Connect a server$'
                commands:
                  - tapOn: '^Connect a server$'
- assertVisible: 'https://plano\.example\.org'
- tapOn: 'https://plano\.example\.org'
- inputText: ${SERVER_URL}
- tapOn: "Plano server"
- tapOn: "Connect to server"
- extendedWaitUntil:
    visible: "Find a flight"
    timeout: 30000
# Maestro's back command supports Android and Web. Relaunch returns to Home on iOS.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Find a flight"
    timeout: 30000
- tapOn: "Find a flight"
- tapOn: "UA123"
- inputText: "UA123"
- tapOn: "Use the departure date at the origin airport."
- tapOn: "Tomorrow"
- tapOn: "Search flights"
- extendedWaitUntil:
    visible: "UA123, SFO to EWR, Scheduled, Demo flight · Simulated data"
    timeout: 30000
- tapOn: "UA123, SFO to EWR, Scheduled, Demo flight · Simulated data"
- extendedWaitUntil:
    visible: "Track flight"
    timeout: 30000
- tapOn: "Track flight"
- extendedWaitUntil:
    visible: "Stop tracking"
    timeout: 30000
- takeScreenshot: ios-tracked-detail
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "View UA123"
    timeout: 30000
- takeScreenshot: ios-relaunch-home
- tapOn: "View UA123"
- extendedWaitUntil:
    visible: "Stop tracking"
    timeout: 30000
