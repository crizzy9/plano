name: Verify Plano

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  EXPO_NO_TELEMETRY: '1'
  NODE_OPTIONS: --max-old-space-size=1024

jobs:
  backend:
    name: Go and self-hosted demo
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: go.sum
      - run: go test -race -p=1 ./...
      - run: go vet -p=1 ./...
      - run: bash deploy/verify-demo.sh

  mobile:
    name: Mobile fixtures and bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: node --test --test-concurrency=1 scripts/*.test.cjs
      - run: npm run typecheck
      - run: |
          npx --no-install expo export --platform android --max-workers 1 --output-dir "$RUNNER_TEMP/plano-android-bundle"
          npx --no-install expo export --platform ios --max-workers 1 --output-dir "$RUNNER_TEMP/plano-ios-bundle"

  android:
    name: Android ARM64 preview
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLANO_ANDROID_PREVIEW_BUILD: '1'
      PLANO_ANDROID_PACKAGE: app.plano.preview
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: npm ci
      - run: npx --no-install expo prebuild --platform android --no-install
      - name: Compile and verify the preview APK
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon --max-workers=1 --no-parallel \
            '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:ActiveProcessorCount=2' \
            -Pkotlin.compiler.execution.strategy=in-process -PreactNativeArchitectures=arm64-v8a :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk")
          grep -F "package: name='$PLANO_ANDROID_PACKAGE'" <<< "$badging"
          grep -E "^native-code: 'arm64-v8a'[[:space:]]*$" <<< "$badging"
          manifest=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree "$apk" --file AndroidManifest.xml)
          grep -F 'app.plano.live.PlanoMessagingService' <<< "$manifest"
          grep -F 'app.plano.live.PlanoFlightWidgetProvider' <<< "$manifest"
          if grep -Fq 'expo.modules.notifications.service.ExpoFirebaseMessagingService' <<< "$manifest"; then exit 1; fi

  ios:
    name: iOS simulator and widget
    runs-on: macos-26
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
      PLANO_IOS_BUNDLE_ID: app.plano.verify
      PLANO_IOS_APNS_ENVIRONMENT: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Verify Live Activity selection
        run: |
          xcrun swiftc -j 1 -parse-as-library \
            modules/plano-live/ios/ActivityIdentity.swift scripts/ActivityIdentityFixture.swift \
            -o "$RUNNER_TEMP/plano-activity-identity-fixture"
          "$RUNNER_TEMP/plano-activity-identity-fixture"
      - run: npm ci
      - name: Generate the Xcode workspace
        run: |
          xcodebuild -version
          npx --no-install expo prebuild --platform ios --no-install
          pod install --project-directory=ios
      - name: Compile the app and verify the embedded Live Activity extension
        run: |
          derived_data="$RUNNER_TEMP/plano-ios"
          xcodebuild -workspace ios/Plano.xcworkspace -scheme Plano \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$derived_data" -jobs 1 \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build
          app="$derived_data/Build/Products/Release-iphonesimulator/Plano.app"
          extension="$app/PlugIns/PlanoActivity.appex"
          test -s "$extension/PlanoActivity"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = "$PLANO_IOS_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$extension/Info.plist")" = "$PLANO_IOS_BUNDLE_ID.activity"
      - name: Launch the app on an installed iPhone simulator
        timeout-minutes: 5
        run: |
          app="$RUNNER_TEMP/plano-ios/Build/Products/Release-iphonesimulator/Plano.app"
          device=$(xcrun simctl list devices available --json | jq -er '
            [.devices | to_entries[]
             | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-26-4"))
             | .value[]
             | select(.isAvailable and .state == "Shutdown" and (.name | startswith("iPhone")))]
            | .[0].udid | strings')
          test -n "$device"
          cleanup() {
            xcrun simctl terminate "$device" "$PLANO_IOS_BUNDLE_ID" >/dev/null 2>&1 || true
            xcrun simctl shutdown "$device" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          launched=$(xcrun simctl launch --terminate-running-process "$device" "$PLANO_IOS_BUNDLE_ID")
          printf '%s\n' "$launched"
          pid=${launched##*: }
          [[ "$pid" =~ ^[0-9]+$ ]]
          sleep 10
          kill -0 "$pid"
          ps -p "$pid" -o command= | grep -F '/Plano.app/Plano'
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/plano-ios-launch.png"
      - name: Keep the iOS launch screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plano-ios-simulator-launch
          path: ${{ runner.temp }}/plano-ios-launch.png
          if-no-files-found: error
          retention-days: 7
