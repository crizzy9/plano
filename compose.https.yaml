services:
  plano:
    ports: !reset []
    environment:
      PLANO_DEMO: "${PLANO_DEMO:-false}"
      PLANO_PUBLIC_URL: "https://${PLANO_DOMAIN:?Set PLANO_DOMAIN to your DNS hostname}"
      PLANO_REQUIRE_ENROLLMENT: "true"

  caddy:
    image: docker.io/library/caddy:2.11.9-alpine
    environment:
      PLANO_DOMAIN: "${PLANO_DOMAIN:?Set PLANO_DOMAIN to your DNS hostname}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      plano:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
