services:
  plano:
    build:
      context: .
    environment:
      PLANO_ADDR: ":8080"
      PLANO_LOG_LEVEL: "${PLANO_LOG_LEVEL:-info}"
      PLANO_DB: /data/plano.db
      PLANO_DEMO: "${PLANO_DEMO:-true}"
      PLANO_PUBLIC_URL: "${PLANO_PUBLIC_URL:-http://localhost:8080}"
      PLANO_HEALTH_URL: "${PLANO_HEALTH_URL:-}"
      PLANO_REFRESH_INTERVAL: "${PLANO_REFRESH_INTERVAL:-60s}"
      PLANO_ENROLLMENT_CODE: "${PLANO_ENROLLMENT_CODE:-}"
      PLANO_ENROLLMENT_CODE_FILE: "${PLANO_ENROLLMENT_CODE_FILE:-}"
      PLANO_REQUIRE_ENROLLMENT: "${PLANO_REQUIRE_ENROLLMENT:-false}"
      PLANO_ALLOW_OPEN_ENROLLMENT: "${PLANO_ALLOW_OPEN_ENROLLMENT:-false}"
      PLANO_AEROAPI_KEY: "${PLANO_AEROAPI_KEY:-}"
      PLANO_AEROAPI_KEY_FILE: "${PLANO_AEROAPI_KEY_FILE:-}"
      PLANO_AEROALERTS_KEY_FILE: "${PLANO_AEROALERTS_KEY_FILE:-}"
      PLANO_AERO_SUBSCRIPTIONS: "${PLANO_AERO_SUBSCRIPTIONS:-false}"
      PLANO_AERO_SUBSCRIPTIONS_INBOUND: "${PLANO_AERO_SUBSCRIPTIONS_INBOUND:-false}"
      PLANO_AERO_SUBSCRIPTIONS_MAX: "${PLANO_AERO_SUBSCRIPTIONS_MAX:-10}"
      PLANO_AERO_SUBSCRIPTIONS_INTERVAL: "${PLANO_AERO_SUBSCRIPTIONS_INTERVAL:-5m}"
      PLANO_ADVISORY_INGRESS_KEY_FILE: "${PLANO_ADVISORY_INGRESS_KEY_FILE:-}"
      PLANO_FLIGHT_OBSERVATION_KEY_FILE: "${PLANO_FLIGHT_OBSERVATION_KEY_FILE:-}"
      PLANO_FAA_NAS: "${PLANO_FAA_NAS:-true}"
      PLANO_METAR: "${PLANO_METAR:-false}"
      PLANO_SWIM_URL: "${PLANO_SWIM_URL:-}"
      PLANO_SWIM_TOKEN: "${PLANO_SWIM_TOKEN:-}"
      PLANO_SWIM_TOKEN_FILE: "${PLANO_SWIM_TOKEN_FILE:-}"
      PLANO_EUROCONTROL_URL: "${PLANO_EUROCONTROL_URL:-}"
      PLANO_EUROCONTROL_TOKEN: "${PLANO_EUROCONTROL_TOKEN:-}"
      PLANO_EUROCONTROL_TOKEN_FILE: "${PLANO_EUROCONTROL_TOKEN_FILE:-}"
      PLANO_ADSB_URL: "${PLANO_ADSB_URL:-}"
      PLANO_ADSB_REFRESH_INTERVAL: "${PLANO_ADSB_REFRESH_INTERVAL:-5s}"
      PLANO_FAA_REGISTRY_FILE: "${PLANO_FAA_REGISTRY_FILE:-}"
      PLANO_AIRPORT_TRANSFERS_FILE: "${PLANO_AIRPORT_TRANSFERS_FILE:-}"
      PLANO_BOOKING_KEY_FILE: "${PLANO_BOOKING_KEY_FILE:-}"
      PLANO_RESERVATION_GATEWAY_URL: "${PLANO_RESERVATION_GATEWAY_URL:-}"
      PLANO_RESERVATION_GATEWAY_TOKEN: "${PLANO_RESERVATION_GATEWAY_TOKEN:-}"
      PLANO_RESERVATION_GATEWAY_TOKEN_FILE: "${PLANO_RESERVATION_GATEWAY_TOKEN_FILE:-}"
      PLANO_TRIPIT_SYNC_KEY_FILE: "${PLANO_TRIPIT_SYNC_KEY_FILE:-}"
      PLANO_TRIPIT_SYNC_INTERVAL: "${PLANO_TRIPIT_SYNC_INTERVAL:-30m}"
      PLANO_DELAY_MODEL_FILE: "${PLANO_DELAY_MODEL_FILE:-}"
      PLANO_EARLY_DELAY_MODEL_FILE: "${PLANO_EARLY_DELAY_MODEL_FILE:-}"
      PLANO_HISTORICAL_RISK_FILE: "${PLANO_HISTORICAL_RISK_FILE:-}"
      PLANO_COLLECT_DELAY_SAMPLES: "${PLANO_COLLECT_DELAY_SAMPLES:-false}"
      PLANO_APNS_TEAM_ID: "${PLANO_APNS_TEAM_ID:-}"
      PLANO_APNS_KEY_ID: "${PLANO_APNS_KEY_ID:-}"
      PLANO_APNS_BUNDLE_ID: "${PLANO_APNS_BUNDLE_ID:-}"
      PLANO_APNS_PRIVATE_KEY_FILE: "${PLANO_APNS_PRIVATE_KEY_FILE:-}"
      PLANO_APNS_SANDBOX: "${PLANO_APNS_SANDBOX:-false}"
      PLANO_FCM_PROJECT_ID: "${PLANO_FCM_PROJECT_ID:-}"
      PLANO_FCM_SERVICE_ACCOUNT_FILE: "${PLANO_FCM_SERVICE_ACCOUNT_FILE:-}"
      PLANO_FCM_BANDWIDTH_CONSTRAINED: "${PLANO_FCM_BANDWIDTH_CONSTRAINED:-false}"
    ports:
      - "${PLANO_BIND_IP:-127.0.0.1}:${PLANO_PORT:-8080}:8080"
    volumes:
      - plano_data:/data
    healthcheck:
      test: [CMD, /usr/local/bin/plano, healthcheck]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  plano_data:
